name: Release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j3
      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - "build/Hecate_artefacts/Release/VST3/Hecate.vst3"
          codesign --force --deep -s - "build/Hecate_artefacts/Release/AU/Hecate.component"
          codesign --force --deep -s - "build/Hecate_artefacts/Release/Standalone/Hecate.app"
      - name: Package
        run: |
          cd build/Hecate_artefacts/Release
          zip -qr ../../../Hecate-${{ github.ref_name }}-macOS.zip VST3 AU Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: Hecate-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/Hecate_artefacts/Release/VST3/*" -DestinationPath "Hecate-${{ github.ref_name }}-Windows-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Hecate-*.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Hecate-*.zip
          generate_release_notes: true
